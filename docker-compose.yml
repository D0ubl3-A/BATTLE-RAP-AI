version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rapbots_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rapbots_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rapbots_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rapbots_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rapbots_postgres_data:
